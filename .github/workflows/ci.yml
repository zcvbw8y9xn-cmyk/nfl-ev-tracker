name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Compile + tests + dataset integrity
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run gate (compile + unit tests + dataset integrity)
        # make check-ci = py_compile ALL sources, run the 24-test suite, then run
        # tools/validate_dataset.py. With --allow-missing, a fresh checkout that has no
        # cached scrape dataset still passes (the check is skipped, not failed); when a
        # dataset is present it gates on phantom EV / orphan markets / EV math / NaN /
        # duplicate rows. A failing any of these fails the build.
        run: make check-ci
